; Headless DOSBox-X profile for rebuilding XDC.
; Iteration speed, not cycle-accurate fidelity.
; The drives (C:, S:, O:) are mounted by lab/build.sh.

[sdl]
fullscreen=false
output=surface
autolock=false
waitonerror=false

[dosbox]
machine=svga_s3
memsize=32
startup_verbosity=quiet

[cpu]
core=auto
cputype=auto
cycles=max

[render]
aspect=false
frameskip=0

[mixer]
nosound=true

[midi]
mpu401=none
mididevice=none

[sblaster]
sbtype=none

[gus]
gus=false

[speaker]
pcspeaker=false

[joystick]
joysticktype=none

[dos]
lfn=false
