; Profil DOSBox-X headless pour recompiler XDC.
; Vitesse d'itération, pas de fidélité cycle par cycle.
; Les lecteurs (C:, S:, O:) sont montés par lab/build.sh.

[sdl]
fullscreen=false
output=surface
autolock=false
waitonerror=false

[dosbox]
machine=svga_s3
memsize=32
startup_verbosity=quiet

[cpu]
core=auto
cputype=auto
cycles=max

[render]
aspect=false
frameskip=0

[mixer]
nosound=true

[midi]
mpu401=none
mididevice=none

[sblaster]
sbtype=none

[gus]
gus=false

[speaker]
pcspeaker=false

[joystick]
joysticktype=none

[dos]
lfn=false
